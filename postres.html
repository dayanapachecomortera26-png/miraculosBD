<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postres por rebanada</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header-pan">
            <a href="menu.html" class="volver">← Volver</a>
            <h1 class="titulo-cafe"> Postres </h1>
            <p style="font-family: 'Pacifico', cursive; text-align:center; font-size:20px; color:#6b3a19;">Preparados con mucho sabor, dulces y frescos para ti y tu familia ❤️</p>
        </header>

        <main class="galeria-Postres">
            <div class="item-Postres">
                <img src="imagenes/payLimon.jpg" alt="Pay de Limón" class="cycle">
                <p>Pay de Limon $35.00</p>
            </div>
            <div class="item-Postres">
                <img src="imagenes/pastelchocolate.jpg" alt="Pastel de Chocolate" class="cycle">
                <p>Pastel de Chocolate $45.00</p>
            </div>
            <div class="item-Postres">
                <img src="imagenes/heladoVainilla.jpg" alt="Helado de Vainilla" class="cycle">
                <p>Helado de Vainilla $30.00</p>
            </div>
            <div class="item-Postres">
                <img src="imagenes/frappe.jpg" alt="Frappe" class="cycle">
                <p>Frappe $70.00</p>
            </div>
            <div class="item-Postres">
                <img src="imagenes/pastel3leche.jpg" alt="Pastel de 3 Leche" class="cycle">
                <p>Pastel de 3 Leche $40.00</p>
            </div>
            <div class="item-Postres">
                <img src="imagenes/flan.jpg" alt="Flan" class="cycle">
                <p>Flan $45.00</p>
            </div>
        </main>

         <footer>
            <a href="menu.html" class="volver">Volver al Menu</a>
        </footer>
    </div>
</body>
</html>
