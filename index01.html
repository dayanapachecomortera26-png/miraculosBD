<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Principal - Boulangerie Patisserie</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="titulo">🍞 Boulangerie <span>Patisserie</span></h1>

        <div class="bienvenida">

            <button id="si" class="btn">Sí, tengo cuenta</button>
            <button id="no" class="btn">No, quiero crear una cuenta</button>
        </div>

        <footer>
            <p>© 2025 Boulangerie Patisserie</p>
        </footer>
    </div>


    <script>
        document.getElementById('si').onclick = function() {
            window.location.href = 'login.html'; 
        };

        document.getElementById('no').onclick = function() {
            window.location.href = 'registro.html'; 
        };
    </script>
</body>
</html>
